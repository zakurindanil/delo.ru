<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="../resourses/css/profile_style.css">
    <link rel="stylesheet" href="../resourses/css/font.css">
</head>
<body>
    <header>
        <div class="header-left">
            <a href="login.html">
                <img src="../resourses/img/exit.png" alt="Выход">
            </a>
            <label for="title">ДЕЛО.РУ</label>
        </div> 
    
        <div class="header-right">
            <div class="name-role">
                <label for="username" class="username">Иванов И.И.</label>
                <label for="role" class="role">Заявитель</label>
            </div>
            <a href="profile.html">
                <img src="../resourses/img/icon_user_light.png" alt="Профиль" class="userAvatar">
            </a>
        </div>
    </header>

        <div class="content-items">
            <div class="left-panel">
                <div class="left-content-panel">
                    <img src="../resourses/img/icon_user_light.png" alt="Аватар" class="userAvatar">
                    <span class="role">Заявитель</span>
                    <span class="username">Иванов Иван</span>
                    <button id="backBtn">Назад в меню</button>
                </div>
            </div>
            <div class="right-panel">
                <div class="right-content-panel">
                    <h2>Личный кабинет заявителя</h2>
                    <p>Здесь вы можете дополнить или изменить данные вашего профиля.</p>
                    <form id="profileForm">
                        <div class="form-group">
                            <label for="fullName">ФИО</label>
                            <input type="text" id="fullName" name="fio">
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email">
                        </div>
                    
                        <div class="form-group">
                            <label for="phone">Телефон</label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                    
                        <div class="form-group">
                            <label for="password">Новый пароль</label>
                            <input type="password" id="password" name="password" placeholder="Новый пароль (оставьте пустым, если не хотите менять пароль)">
                        </div>

                        <div class="form-group">
                            <label>Фото профиля</label>
                            <div class="choose-img-group">
                                <div class="avatar-container">
                                    <img src="../resourses/img/icon_user.png" 
                                         alt="Аватар" 
                                         class="avatar userAvatar" 
                                         id="avatarPreview"
                                         onclick="document.getElementById('avatarInput').click()">
                                    <input type="file" 
                                           id="avatarInput" 
                                           name="avatar" 
                                           accept="image/*" 
                                           hidden>
                                </div>
                            </div>
                        </div>

                        <div id="errorBox" class="error-box" style="display:none;"></div>

                        <div class="button-group">
                            <button type="submit" class="btn-save">Сохранить изменения</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    <footer>
        <div class="foot">
            <div class="left">
                <label for="title">ДЕЛО.РУ</label>
                <p>г.Пермь, ул.Комсомольский проспект, 20 <br> +7 (912) 888-70-54</p>
            </div>
            <div class="right">
                <p>Заглядывайте к нам:</p>
                <div class="img_soc">
                    <img class="social_networks">
                    <img class="social_networks">
                    <img class="social_networks">
                </div>
            </div>
        </div>
        <div class="rights">
            <p>©2026 ДЕЛО.РУ | Все права защищены</p>
        </div>
    </footer>

    <script src="../resourses/js/session.js"></script>

    <script>
        document.getElementById('backBtn').addEventListener('click', async () => {
            const res = await fetch('../api/user_data.php');
            const json = await res.json();

            if (!json.ok) {
                window.location.href = 'login.html';
                return;
            }

            const pages = {
                applicant: 'applicant_main.html',
                judge: 'judge_main.html',
                admin: 'admin_main.html'
            };
            window.location.href = pages[json.user.role] || 'login.html';
        });

        document.getElementById('avatarInput').addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('avatarPreview').src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const box = document.getElementById('errorBox');
            box.style.display = 'none';

            const data = new FormData();
            data.append('fio', document.getElementById('fullName').value);
            data.append('email', document.getElementById('email').value);
            data.append('phone', document.getElementById('phone').value);
            data.append('password', document.getElementById('password').value);

            const avatar = document.getElementById('avatarInput').files[0];
            if (avatar) data.append('avatar', avatar);

            const res  = await fetch('../api/update_profile.php', {
                method: 'POST',
                body: data
            });

            const json = await res.json();

            if (json.ok) {
                alert('Профиль обновлён!');
                location.reload();
            } else {
                box.textContent = json.error;
                box.style.display = 'block';
            }
        });
    </script>

</body>


</html>
