<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../resourses/css/style_log.css"/>
    <link rel="stylesheet" href="../resourses/css/font.css">
    <title>Вход</title>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>ДЕЛО.РУ</h1>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="login">Логин (Email)</label>
                <input type="text" id="login" name="login" value="Заявитель">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" value="1234">
            </div>

            <div class="button-group">
                <button type="button" class="btn-login" onclick="window.location.href='applicant_main.html'">ВХОД</button>
            </div>

            <div class="links">
                <p>Нет аккаунта? <a href="registration.html" id="registrationLink">Регистрация</a></p>
            </div>

            <div class="forgot-password" id="forgotPassword">
                Забыли пароль?
            </div>
        </form>
    </div>

    <footer>
        <div class="foot">
            <div class="left">
                <label for="title">ДЕЛО.РУ</label>
                <p>г.Пермь, ул.Комсомольский проспект, 20 <br> +7 (912) 888-70-54</p>
            </div>
            <div class="right">
                <p>Заглядывайте к нам:</p>
                <div class="img_soc">
                    <img class="social_networks">
                    <img class="social_networks">
                    <img class="social_networks">
                </div>
            </div>
        </div>
        <div class="rights">
            <p>©2026 ДЕЛО.РУ | Все права защищены</p>
        </div>
    </footer>
</body>
</html>
