<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../resourses/css/style_log.css"/>
    <link rel="stylesheet" href="../resourses/css/font.css">
    <title>Login</title>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>ДЕЛО.РУ</h1>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="login">Логин (Email / СНИЛС / Телефон)</label>
                <input type="text" id="login" name="login" value="Заявитель">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" value="1234">
            </div>

            <div class="button-group">
                <button type="submit" class="btn-login">ВХОД</button>
            </div>

            <div class="links">
                <p>Нет аккаунта? <a href="registration.html" id="registrationLink">Регистрация</a></p>
            </div>

            <div class="forgot-password" id="forgotPassword">
                Забыли пароль?
            </div>
        </form>
    </div>
</body>
</html>
