<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../resourses/css/style_log.css"/>
    <link rel="stylesheet" href="../resourses/css/font.css">
    <title>Вход</title>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>ДЕЛО.РУ</h1>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="login">Логин (Email)</label>
                <input type="email" id="login" name="login">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password">
            </div>

            <div id="errorBox" class="error-box" style="display:none;"></div>

            <div class="button-group">
                <button type="submit" class="btn-login">ВХОД</button>
            </div>

            <div class="links">
                <p>Нет аккаунта? <a href="registration.html" id="registrationLink">Регистрация</a></p>
            </div>

            <div class="forgot-password" id="forgotPassword">
                Забыли пароль?
            </div>
        </form>
    </div>

    <footer>
        <div class="foot">
            <div class="left">
                <label for="title">ДЕЛО.РУ</label>
                <p>г.Пермь, ул.Комсомольский проспект, 20 <br> +7 (912) 888-70-54</p>
            </div>
            <div class="right">
                <p>Заглядывайте к нам:</p>
                <div class="img_soc">
                    <img class="social_networks">
                    <img class="social_networks">
                    <img class="social_networks">
                </div>
            </div>
        </div>
        <div class="rights">
            <p>©2026 ДЕЛО.РУ | Все права защищены</p>
        </div>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                login: document.getElementById('login').value,
                password: document.getElementById('password').value
            };

            const res = await fetch('../api/login_form.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const json = await res.json();

            if (json.ok) {
                if (json.role === 'applicant') {
                    window.location.href = 'applicant_main.html';
                } else if (json.role === 'admin') {
                    window.location.href = 'admin_main.html'
                } else if (json.role === 'judge') {
                    window.location.href = 'judge_main.html'
                } else {
                    alert('Неизвестная роль!')
                }
            } else {
                const box = document.getElementById('errorBox');
                box.textContent = json.error;
                box.style.display = 'block';
            }
        });
    </script>
</body>
</html>
