<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../resourses/css/style_log.css"/>
    <link rel="stylesheet" href="../resourses/css/font.css">
    <title>Сброс пароля</title>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>ДЕЛО.РУ</h1>
        </div>

        <form id="resetForm">
            <div class="form-group">
                <label for="code">Код из письма</label>
                <input type="text" id="code" name="code" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required>
            </div>

            <div class="form-group">
                <label for="password">Новый пароль</label>
                <input type="password" id="password" name="password" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="password2">Повторите пароль</label>
                <input type="password" id="password2" name="password2" minlength="6" required>
            </div>

            <div id="errorBox" class="error-box" style="display:none;"></div>
            <div id="successBox" class="error-box" style="display:none; background:#e8f5e9; color:#1b5e20; border-color:#c8e6c9;"></div>

            <div class="button-group">
                <button type="submit" class="btn-login">СМЕНИТЬ ПАРОЛЬ</button>
            </div>

            <div class="links">
                <p><a href="forgot_password.html">Отправить код заново</a> · <a href="login.html">Ко входу</a></p>
            </div>
        </form>
    </div>

    <footer>
        <div class="foot">
            <div class="left">
                <label for="title">ДЕЛО.РУ</label>
                <p>г.Пермь, ул.Комсомольский проспект, 20 <br> +7 (912) 888-70-54</p>
            </div>
            <div class="right">
                <p>Заглядывайте к нам:</p>
                <div class="img_soc">
                    <img class="social_networks">
                    <img class="social_networks">
                    <img class="social_networks">
                </div>
            </div>
        </div>
        <div class="rights">
            <p>©2026 ДЕЛО.РУ | Все права защищены</p>
        </div>
    </footer>

    <script>
        const errBox = document.getElementById('errorBox');
        const okBox  = document.getElementById('successBox');

        function showError(msg) {
            errBox.textContent = msg;
            errBox.style.display = 'block';
            okBox.style.display = 'none';
        }
        function showOk(msg) {
            okBox.textContent = msg;
            okBox.style.display = 'block';
            errBox.style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            errBox.style.display = 'none';
            okBox.style.display  = 'none';

            const code = document.getElementById('code').value.trim();
            const pwd  = document.getElementById('password').value;
            const pwd2 = document.getElementById('password2').value;

            if (!/^\d{6}$/.test(code)) {
                return showError('Код должен состоять из 6 цифр');
            }
            if (pwd.length < 6) {
                return showError('Пароль должен быть не короче 6 символов');
            }
            if (pwd !== pwd2) {
                return showError('Пароли не совпадают');
            }

            // 1. Проверяем код
            const verifyRes = await fetch('../api/verify_reset_code.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            const verifyJson = await verifyRes.json();

            if (!verifyJson.ok) {
                return showError(verifyJson.error);
            }

            // 2. Меняем пароль
            const resetRes = await fetch('../api/reset_password.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd })
            });
            const resetJson = await resetRes.json();

            if (resetJson.ok) {
                showOk('Пароль изменён! Перенаправляем на вход...');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                showError(resetJson.error);
            }
        });
    </script>
</body>
</html>
