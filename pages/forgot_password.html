<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../resourses/css/style_log.css"/>
    <link rel="stylesheet" href="../resourses/css/font.css">
    <title>Восстановление пароля</title>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>ДЕЛО.РУ</h1>
        </div>

        <form id="forgotForm">
            <div class="form-group">
                <label for="email">Введите email, указанный при регистрации</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div id="errorBox" class="error-box" style="display:none;"></div>
            <div id="successBox" class="error-box" style="display:none; background:#e8f5e9; color:#1b5e20; border-color:#c8e6c9;"></div>

            <div class="button-group">
                <button type="submit" class="btn-login">ОТПРАВИТЬ КОД</button>
            </div>

            <div class="links">
                <p><a href="login.html">Вернуться ко входу</a></p>
            </div>
        </form>
    </div>

    <footer>
        <div class="foot">
            <div class="left">
                <label for="title">ДЕЛО.РУ</label>
                <p>г.Пермь, ул.Комсомольский проспект, 20 <br> +7 (912) 888-70-54</p>
            </div>
            <div class="right">
                <p>Заглядывайте к нам:</p>
                <div class="img_soc">
                    <img class="social_networks">
                    <img class="social_networks">
                    <img class="social_networks">
                </div>
            </div>
        </div>
        <div class="rights">
            <p>©2026 ДЕЛО.РУ | Все права защищены</p>
        </div>
    </footer>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errBox = document.getElementById('errorBox');
            const okBox  = document.getElementById('successBox');
            errBox.style.display = 'none';
            okBox.style.display  = 'none';

            const email = document.getElementById('email').value.trim();

            const res = await fetch('../api/send_reset_code.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const json = await res.json();

            if (json.ok) {
                okBox.textContent = 'Код отправлен! Перенаправляем...';
                okBox.style.display = 'block';

                // Передаём email на следующую страницу
                sessionStorage.setItem('reset_email', email);

                // Для отладки (если сервер вернул debug_code) — покажем
                if (json.debug_code) {
                    okBox.textContent += ' [DEBUG код: ' + json.debug_code + ']';
                }

                setTimeout(() => {
                    window.location.href = 'reset_password.html';
                }, 1200);
            } else {
                errBox.textContent = json.error;
                errBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
